version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dsa_cockpit}
      POSTGRES_USER: ${DB_USER:-dsauser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dsapassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dsa_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dsauser} -d ${DB_NAME:-dsa_cockpit}"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - dsa_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-dsa_cockpit}
      - DB_USER=${DB_USER:-dsauser}
      - DB_PASSWORD=${DB_PASSWORD:-dsapassword}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - static_files:/app/static
      - media_files:/app/media
      - ./my_fav_path:/app/my_fav_path
    networks:
      - dsa_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    networks:
      - dsa_network
    depends_on:
      - web
    profiles:
      - production

networks:
  dsa_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_files:
    driver: local
  media_files:
    driver: local