<div class="fullscreen-viewer" (click)="close()">
  <button
    type="button"
    class="close-button"
    (click)="close(); $event.stopPropagation()"
    aria-label="Schließen"
  >
    &times;
  </button>
  <div class="viewer-content" (click)="$event.stopPropagation()">
    <img [src]="data.url" [alt]="data.caption" />
    <div class="caption" *ngIf="data.caption">{{ data.caption }}</div>
  </div>
</div>
