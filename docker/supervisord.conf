[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/app/logs/supervisord.pid

[program:gunicorn]
command=gunicorn dsa_cockpit.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile /app/logs/gunicorn-access.log --error-logfile /app/logs/gunicorn-error.log
directory=/app
user=dsauser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/gunicorn.log

[program:daphne]
command=daphne -b 0.0.0.0 -p 8001 dsa_cockpit.asgi:application
directory=/app
user=dsauser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/daphne.log

[program:nginx-internal]
command=sh -c 'if [ "$DEBUG" != "True" ]; then nginx -g "daemon off;"; else sleep infinity; fi'
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/nginx.log